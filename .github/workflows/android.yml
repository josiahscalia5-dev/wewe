name: Android CI

on:
  push:
    branches: ['claude/**', 'main']
    tags: ['phase1-*']
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # publishes a JPEG copy of the verification output to refs/ci-verification/*

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Game-rule unit tests (core)
        run: ./gradlew -p core test --console=plain

      - name: Build debug, release and test APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest --console=plain

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulator — API 36 x86_64, compact / standard / tall
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: bash ci/run-device-tests.sh

      - name: Side-by-side comparisons and video frames
        if: always()
        run: |
          python3 -m pip install --quiet pillow
          python3 ci/compare.py verification
          for f in verification/device/*/level3_30s.mp4; do
            [ -f "$f" ] || continue
            d=$(dirname "$f")
            mkdir -p "$d/video_frames"
            ffmpeg -loglevel error -i "$f" -vf "fps=1/3,scale=540:-1" "$d/video_frames/frame_%02d.jpg" || true
          done

      - name: Upload verification (screenshots, comparisons, video)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification
          path: verification/

      - name: Publish verification snapshot (JPEG) to refs/ci-verification
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          rm -rf /tmp/pub && mkdir -p /tmp/pub
          python3 ci/publish_snapshot.py verification /tmp/pub
          cd /tmp/pub
          git init -q
          git config user.name "ci-verification"
          git config user.email "ci-verification@users.noreply.github.com"
          git checkout -q -b snapshot
          git add -A
          git commit -q -m "verification for ${GITHUB_SHA}"
          ref="refs/ci-verification/$(echo "${GITHUB_REF_NAME}" | tr '/' '-')"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${ref}" && echo "published ${ref}"
